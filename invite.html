<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#46583D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=EB+Garamond:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#e9e3d8; font-family:'EB Garamond',serif; padding:28px 16px;
  }
  .invite-card{
    width:100%; max-width:380px; min-height:520px; border-radius:2px;
    padding:46px 30px 36px; text-align:center; position:relative; overflow:hidden;
    box-shadow:0 24px 60px -16px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center;
    font-family:var(--bodyfont,'EB Garamond',serif);
  }
  .eyebrow{font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.28em; text-transform:uppercase; opacity:.75;}
  .names{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-weight:500; font-size:var(--namesize,42px); line-height:1.15; margin:16px 0 10px;}
  .invite-card.no-italic .names{font-style:normal;}
  .amp{display:block; font-size:24px; opacity:.6; margin:2px 0;}
  .divider{width:52px; height:1px; margin:18px auto; background:var(--accent,#B08D57);}
  .details{font-size:var(--detailsize,17px); line-height:2;}
  .dline{margin:1px 0;}
  .guestline{margin-top:24px; font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.06em; opacity:.75;}
  .guestname{font-family:var(--headfont,'Cormorant Garamond',serif); font-size:23px; font-style:italic; margin-top:3px;}
  .invite-card.no-italic .guestname{font-style:normal;}
  .mono-mark{display:none; font-family:var(--headfont); font-size:calc(var(--namesize,42px) * 1.15); opacity:.16; line-height:1; margin-bottom:-2px;}
  .seal{
    width:calc(var(--qrsize,200px) + 24px); height:calc(var(--qrsize,200px) + 24px); border-radius:50%; margin:26px auto 8px;
    display:flex; align-items:center; justify-content:center; position:relative; border:2px solid var(--seal,#000);
  }
  .seal::before{content:''; position:absolute; inset:-7px; border-radius:inherit; border:1px dashed var(--seal,#000); opacity:.5;}
  .seal img,.seal canvas{width:var(--qrsize,200px); height:var(--qrsize,200px);}
  .seal-cap{font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; opacity:.7; margin-top:8px;}
  .addwallet{
    margin-top:20px; font-family:'Inter',sans-serif; font-size:11.5px; background:none;
    border:1px solid currentColor; opacity:.7; padding:8px 14px; border-radius:20px; cursor:pointer;
  }
  .fallback{display:none; font-family:'Inter',sans-serif; font-size:13px; padding:40px 20px; text-align:center; color:#46583D;}

  [data-layout="banner"] .eyebrow{margin:-46px -30px 0; padding:28px 30px 8px; background:var(--accent); color:var(--bg,#F6F1E9);}
  [data-layout="banner"] .names{margin:0 -30px 14px; padding:0 30px 22px; background:var(--accent); color:var(--bg,#F6F1E9);}

  [data-layout="framed"]{padding:58px 38px 42px;}
  [data-layout="framed"]::before{content:''; position:absolute; inset:13px; border:1px solid var(--accent); pointer-events:none;}

  [data-layout="arch"]{border-radius:190px 190px 6px 6px; padding-top:66px;}

  [data-layout="split"]{
    max-width:480px; width:100%; display:grid; row-gap:6px; column-gap:24px; text-align:left; align-items:start;
    grid-template-columns:1.15fr 1fr;
    grid-template-areas:"mono mono" "eyebrow eyebrow" "names names" "divider divider" "details seal" "guest seal";
  }
  [data-layout="split"] .mono-mark{grid-area:mono;}
  [data-layout="split"] .eyebrow{grid-area:eyebrow;}
  [data-layout="split"] .names{grid-area:names;}
  [data-layout="split"] .divider{grid-area:divider; margin-left:0;}
  [data-layout="split"] .details{grid-area:details;}
  [data-layout="split"] .guestblock{grid-area:guest;}
  [data-layout="split"] .sealblock{grid-area:seal; align-self:center; justify-self:center;}
  [data-layout="split"] .addwallet{grid-column:1 / -1; grid-row:7; justify-self:center;}

  [data-layout="monogram"] .mono-mark{display:block;}

  [data-layout="minimalLine"] .seal{border-radius:10px;}
  [data-layout="minimalLine"] .dline{border-bottom:1px solid var(--accent); padding-bottom:5px; margin-bottom:5px; opacity:.92;}
  [data-layout="minimalLine"] .dline:last-child{border-bottom:none; margin-bottom:0;}

  [data-layout="editorial"]{align-items:flex-start; text-align:left; padding-left:42px;}
  [data-layout="editorial"]::before{content:''; position:absolute; left:18px; top:30px; bottom:30px; width:3px; background:var(--accent);}
  [data-layout="editorial"] .divider{margin-left:0;}

  [data-layout="botanical"]::before,[data-layout="botanical"]::after{content:''; position:absolute; width:28px; height:28px; border:1px solid var(--accent); opacity:.65;}
  [data-layout="botanical"]::before{top:15px; left:15px; border-right:none; border-bottom:none;}
  [data-layout="botanical"]::after{bottom:15px; right:15px; border-left:none; border-top:none;}

  [data-layout="timeline"] .details{text-align:left; padding-left:18px; position:relative;}
  [data-layout="timeline"] .details::before{content:''; position:absolute; left:3px; top:6px; bottom:6px; width:1px; background:var(--accent); opacity:.5;}
  [data-layout="timeline"] .dline{position:relative; padding-left:16px;}
  [data-layout="timeline"] .dline::before{content:''; position:absolute; left:-2px; top:7px; width:6px; height:6px; border-radius:50%; background:var(--accent);}
</style>
</head>
<body>
  <div class="invite-card" id="card"></div>
  <div class="fallback" id="fallback">This invite link is missing its details — ask the couple to resend it to you.</div>

<script>
const params = new URLSearchParams(window.location.search);
const get = (k, d='') => params.get(k) || d;

// The couple's card design, baked in so every guest link only needs to carry
// that guest's own id/name/seats instead of repeating the whole design every time.
// Kept in sync with index.html's INVITE_DEFAULTS — index.html only adds a URL
// param when a guest's link actually differs from these (e.g. after the couple
// customizes something), so this is the "nothing customized" baseline, not a cap.
const INVITE_DEFAULTS = {
  p1:'Amara', p2:'Julian', wdate:'2027-02-14', wtime:'16:30',
  venue:'The Old Botanical Hall', city:'Dar es Salaam', eyebrow:'Together with their families',
  cBg:'#f6f1e9', cInk:'#2b2a26', cAccent:'#b08d57', cSeal:'#46583d',
  layout:'classic', hf:0, bf:0, sc:1,
};

const d = {
  p1: get('p1', INVITE_DEFAULTS.p1), p2: get('p2', INVITE_DEFAULTS.p2),
  wdate: get('wdate', INVITE_DEFAULTS.wdate), wtime: get('wtime', INVITE_DEFAULTS.wtime),
  venue: get('venue', INVITE_DEFAULTS.venue), city: get('city', INVITE_DEFAULTS.city),
  eyebrow: get('eyebrow', INVITE_DEFAULTS.eyebrow),
  cBg: get('cBg', INVITE_DEFAULTS.cBg), cInk: get('cInk', INVITE_DEFAULTS.cInk),
  cAccent: get('cAccent', INVITE_DEFAULTS.cAccent), cSeal: get('cSeal', INVITE_DEFAULTS.cSeal),
  layout: get('layout', INVITE_DEFAULTS.layout),
  hf: parseInt(get('hf', INVITE_DEFAULTS.hf), 10) || 0,
  bf: parseInt(get('bf', INVITE_DEFAULTS.bf), 10) || 0,
  sc: parseInt(get('sc', INVITE_DEFAULTS.sc), 10) || 0,
};
const guestId = get('id');
const guestName = get('name');
const seats = parseInt(get('seats','1')) || 1;

// Same layout/type token system as index.html's Template picker.
const HEADING_FONTS = [
  {name:'Cormorant Garamond', css:"'Cormorant Garamond',serif", gf:'Cormorant+Garamond:ital,wght@0,500;0,600;1,500', italic:true},
  {name:'Playfair Display',   css:"'Playfair Display',serif",   gf:'Playfair+Display:ital,wght@0,500;0,700;1,500',   italic:true},
  {name:'Marcellus',          css:"'Marcellus',serif",          gf:'Marcellus',                                     italic:false},
  {name:'Italiana',           css:"'Italiana',serif",           gf:'Italiana',                                      italic:false},
  {name:'Cormorant',          css:"'Cormorant',serif",          gf:'Cormorant:ital,wght@0,500;0,600;1,500',         italic:true},
];
const BODY_FONTS = [
  {name:'EB Garamond',  css:"'EB Garamond',serif",     gf:'EB+Garamond:ital,wght@0,400;0,500;1,400'},
  {name:'Lora',         css:"'Lora',serif",            gf:'Lora:ital,wght@0,400;0,500;1,400'},
  {name:'Jost',         css:"'Jost',sans-serif",       gf:'Jost:wght@400;500'},
  {name:'Inter',        css:"'Inter',sans-serif",      gf:'Inter:wght@400;500'},
  {name:'Crimson Text', css:"'Crimson Text',serif",    gf:'Crimson+Text:ital,wght@0,400;0,600;1,400'},
];
const SCALES = [
  {name:'Intimate', nameSize:'34px', detailSize:'15.5px'},
  {name:'Grand',    nameSize:'46px', detailSize:'18px'},
];
const VALID_LAYOUTS = ['classic','banner','framed','arch','split','monogram','minimalLine','editorial','botanical','timeline'];

const loadedFonts = new Set();
function ensureFont(gf){
  if(loadedFonts.has(gf)) return;
  loadedFonts.add(gf);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + gf + '&display=swap';
  document.head.appendChild(link);
}

function fmtDate(iso){
  if(!iso) return '';
  const dt = new Date(iso+'T00:00:00');
  return dt.toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

if(!guestId || !guestName){
  document.getElementById('card').style.display='none';
  document.getElementById('fallback').style.display='block';
} else {
  const card = document.getElementById('card');
  const layout = VALID_LAYOUTS.includes(d.layout) ? d.layout : 'classic';
  const hf = HEADING_FONTS[d.hf] || HEADING_FONTS[0];
  const bf = BODY_FONTS[d.bf] || BODY_FONTS[0];
  const sc = SCALES[d.sc] || SCALES[1];
  const mono = ((d.p1||'')[0]||'').toUpperCase() + ((d.p2||'')[0]||'').toUpperCase();

  card.dataset.layout = layout;
  card.style.background = d.cBg;
  card.style.color = d.cInk;
  card.style.setProperty('--bg', d.cBg);
  card.style.setProperty('--accent', d.cAccent);
  card.style.setProperty('--seal', d.cSeal);
  card.style.setProperty('--headfont', hf.css);
  card.style.setProperty('--bodyfont', bf.css);
  card.style.setProperty('--namesize', sc.nameSize);
  card.style.setProperty('--detailsize', sc.detailSize);
  card.classList.toggle('no-italic', !hf.italic);
  ensureFont(hf.gf);
  ensureFont(bf.gf);

  card.innerHTML = `
    <div class="mono-mark">${mono}</div>
    <div class="eyebrow">${d.eyebrow}</div>
    <div class="names">${d.p1}<span class="amp">&amp;</span>${d.p2}</div>
    <div class="divider"></div>
    <div class="details">
      <div class="dline">${fmtDate(d.wdate)}</div>
      <div class="dline">${fmtTime(d.wtime)}</div>
      <div class="dline">${[d.venue,d.city].filter(Boolean).join(', ')}</div>
    </div>
    <div class="guestblock">
      <div class="guestline">Reserved for</div>
      <div class="guestname">${guestName}${seats>1?` &amp; party of ${seats}`:''}</div>
    </div>
    <div class="sealblock">
      <div class="seal" id="sealBox"></div>
      <div class="seal-cap">present this code at entry</div>
    </div>
    <button class="addwallet" onclick="window.print()">Save / print this invite</button>
  `;

  // Payload the door-scanner will decode. Self-contained, no server lookup needed.
  // Compact pipe-delimited format (not JSON) keeps the QR small enough to scan reliably
  // off a phone screen — every extra character here adds modules, and more modules
  // packed into the same physical size means fewer pixels per module for a camera to resolve.
  const payload = ['WED1', guestId, guestName, String(seats)].join('|');

  // A denser QR (more characters -> more modules) needs proportionally more physical
  // pixels to stay scannable; the split layout's QR sits in a narrower column so it
  // gets a smaller-but-still-solid size. Keep the QRCode pixel size and the CSS display
  // size identical so the canvas is never upscaled (which would blur it and break scans).
  const qrSize = layout === 'split' ? 150 : 200;
  card.style.setProperty('--qrsize', qrSize + 'px');

  try{
    if(typeof QRCode === 'undefined') throw new Error('QRCode library did not load');
    new QRCode(document.getElementById('sealBox'), {
      text: payload,
      width: qrSize, height: qrSize,
      colorDark: d.cInk, colorLight: d.cBg,
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(err){
    document.getElementById('sealBox').innerHTML =
      `<div style="font-size:9px; padding:6px; word-break:break-all; font-family:monospace; line-height:1.3;">${guestId}</div>`;
    document.getElementById('sealBox').title = 'QR code failed to generate — reload this page. Door staff can paste this ID manually.';
  }
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
