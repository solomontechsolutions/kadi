<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're Invited</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#46583D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=EB+Garamond:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="vendor/qrcode.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#e9e3d8; font-family:'EB Garamond',serif; padding:28px 16px;
  }
  .invite-card{
    width:100%; max-width:380px; min-height:520px; border-radius:2px;
    padding:46px 30px 36px; text-align:center; position:relative; overflow:hidden;
    box-shadow:0 24px 60px -16px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center;
    font-family:var(--bodyfont,'EB Garamond',serif);
  }
  .eyebrow{font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.28em; text-transform:uppercase; opacity:.75;}
  .names{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-weight:500; font-size:var(--namesize,42px); line-height:1.15; margin:16px 0 10px;}
  .invite-card.no-italic .names{font-style:normal;}
  .amp{display:block; font-size:24px; opacity:.6; margin:2px 0;}
  .divider{width:52px; height:1px; margin:18px auto; background:var(--accent,#B08D57);}
  .details{font-size:var(--detailsize,17px); line-height:2;}
  .dline{margin:1px 0;}
  .guestline{margin-top:24px; font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.06em; opacity:.75;}
  .guestname{font-family:var(--headfont,'Cormorant Garamond',serif); font-size:23px; font-style:italic; margin-top:3px;}
  .invite-card.no-italic .guestname{font-style:normal;}
  .mono-mark{display:none; font-family:var(--headfont); font-size:calc(var(--namesize,42px) * 1.15); opacity:.16; line-height:1; margin-bottom:-2px;}
  .photoblock{width:100px; height:100px; margin:0 auto 16px; border-radius:50%; overflow:hidden; border:2px solid var(--seal,#000); flex:none;}
  .photoblock img{width:100%; height:100%; object-fit:cover; display:block;}
  .eventcolors{margin-top:20px;}
  .eventcolors .eclabel{font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; opacity:.65; margin-bottom:8px;}
  .ecolors-row{display:flex; justify-content:center; gap:9px;}
  .ecolor{width:20px; height:20px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.15);}
  .sealrow{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .ptag{font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; border:1px solid currentColor; opacity:.8; padding:5px 11px; border-radius:20px;}
  .seal{
    width:calc(var(--qrsize,200px) + 24px); height:calc(var(--qrsize,200px) + 24px); border-radius:50%; margin:26px auto 8px;
    display:flex; align-items:center; justify-content:center; position:relative; border:2px solid var(--seal,#000);
  }
  .seal::before{content:''; position:absolute; inset:-7px; border-radius:inherit; border:1px dashed var(--seal,#000); opacity:.5;}
  .seal img,.seal canvas{width:var(--qrsize,200px); height:var(--qrsize,200px);}
  .seal-cap{font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; opacity:.7; margin-top:8px;}
  .addwallet{
    margin-top:20px; font-family:'Inter',sans-serif; font-size:11.5px; background:none;
    border:1px solid currentColor; opacity:.7; padding:8px 14px; border-radius:20px; cursor:pointer;
  }
  .fallback{display:none; font-family:'Inter',sans-serif; font-size:13px; padding:40px 20px; text-align:center; color:#46583D;}

  [data-layout="banner"] .eyebrow{margin:-46px -30px 0; padding:28px 30px 8px; background:var(--accent); color:var(--bg,#F6F1E9);}
  [data-layout="banner"] .names{margin:0 -30px 14px; padding:0 30px 22px; background:var(--accent); color:var(--bg,#F6F1E9);}

  [data-layout="framed"]{padding:58px 38px 42px;}
  [data-layout="framed"]::before{content:''; position:absolute; inset:13px; border:1px solid var(--accent); pointer-events:none;}

  [data-layout="arch"]{border-radius:190px 190px 6px 6px; padding-top:66px;}

  [data-layout="split"]{
    max-width:480px; width:100%; display:grid; row-gap:6px; column-gap:24px; text-align:left; align-items:start;
    grid-template-columns:1.15fr 1fr;
    grid-template-areas:"photo photo" "mono mono" "eyebrow eyebrow" "names names" "divider divider" "colors colors" "details seal" "guest seal";
  }
  [data-layout="split"] .photoblock{grid-area:photo; justify-self:start; margin:0 0 6px;}
  [data-layout="split"] .mono-mark{grid-area:mono;}
  [data-layout="split"] .eyebrow{grid-area:eyebrow;}
  [data-layout="split"] .names{grid-area:names;}
  [data-layout="split"] .divider{grid-area:divider; margin-left:0;}
  [data-layout="split"] .eventcolors{grid-area:colors;}
  [data-layout="split"] .details{grid-area:details;}
  [data-layout="split"] .guestblock{grid-area:guest;}
  [data-layout="split"] .sealblock{grid-area:seal; align-self:center; justify-self:center;}
  [data-layout="split"] .addwallet{grid-column:1 / -1; grid-row:9; justify-self:center;}

  [data-layout="monogram"] .mono-mark{display:block;}

  [data-layout="minimalLine"] .seal{border-radius:10px;}
  [data-layout="minimalLine"] .dline{border-bottom:1px solid var(--accent); padding-bottom:5px; margin-bottom:5px; opacity:.92;}
  [data-layout="minimalLine"] .dline:last-child{border-bottom:none; margin-bottom:0;}

  [data-layout="editorial"]{align-items:flex-start; text-align:left; padding-left:42px;}
  [data-layout="editorial"]::before{content:''; position:absolute; left:18px; top:30px; bottom:30px; width:3px; background:var(--accent);}
  [data-layout="editorial"] .divider{margin-left:0;}

  [data-layout="botanical"]::before,[data-layout="botanical"]::after{content:''; position:absolute; width:28px; height:28px; border:1px solid var(--accent); opacity:.65;}
  [data-layout="botanical"]::before{top:15px; left:15px; border-right:none; border-bottom:none;}
  [data-layout="botanical"]::after{bottom:15px; right:15px; border-left:none; border-top:none;}

  [data-layout="timeline"] .details{text-align:left; padding-left:18px; position:relative;}
  [data-layout="timeline"] .details::before{content:''; position:absolute; left:3px; top:6px; bottom:6px; width:1px; background:var(--accent); opacity:.5;}
  [data-layout="timeline"] .dline{position:relative; padding-left:16px;}
  [data-layout="timeline"] .dline::before{content:''; position:absolute; left:-2px; top:7px; width:6px; height:6px; border-radius:50%; background:var(--accent);}

  [data-layout="watercolor"]{
    background-image:
      radial-gradient(circle at 8% 6%, color-mix(in srgb, var(--accent) 40%, transparent) 0%, transparent 40%),
      radial-gradient(circle at 94% 96%, color-mix(in srgb, var(--seal) 35%, transparent) 0%, transparent 44%);
    background-repeat:no-repeat;
  }
  [data-layout="watercolor"] .names{font-size:calc(var(--namesize,42px) * 1.05);}
  [data-layout="watercolor"] .divider{width:64px; opacity:.7;}

  [data-layout="artdeco"]{border:1px solid var(--accent); position:relative;}
  [data-layout="artdeco"]::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:76px;
    background:repeating-conic-gradient(from -90deg at 50% 100%, var(--accent) 0deg 8deg, transparent 8deg 16deg);
    opacity:.5; border-radius:76px 76px 0 0; pointer-events:none;
  }
  [data-layout="artdeco"] .names{letter-spacing:.03em; padding-top:14px;}
  [data-layout="artdeco"] .divider{width:84px; height:3px; position:relative; background:var(--accent);}
  [data-layout="artdeco"] .divider::before,[data-layout="artdeco"] .divider::after{content:''; position:absolute; top:50%; width:7px; height:7px; background:var(--accent); transform:translateY(-50%) rotate(45deg);}
  [data-layout="artdeco"] .divider::before{left:-15px;}
  [data-layout="artdeco"] .divider::after{right:-15px;}

  [data-layout="kraftRustic"]{background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0 2px, transparent 2px 5px);}
  [data-layout="kraftRustic"] .eyebrow{position:relative; padding-top:16px;}
  [data-layout="kraftRustic"] .eyebrow::before{content:''; position:absolute; top:-8px; left:50%; transform:translateX(-50%) rotate(-2deg); width:64px; height:15px; border:1px dashed var(--accent); opacity:.6;}
  [data-layout="kraftRustic"] .seal{border-radius:5px; transform:rotate(-3deg);}
  [data-layout="kraftRustic"] .seal::before{border-radius:5px;}

  [data-layout="filmStrip"]{padding-top:60px; padding-bottom:58px; position:relative;}
  [data-layout="filmStrip"]::before,[data-layout="filmStrip"]::after{
    content:''; position:absolute; left:0; right:0; height:12px;
    background-image:repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 24px);
    background-position:center; opacity:.22; pointer-events:none;
  }
  [data-layout="filmStrip"]::before{top:16px;}
  [data-layout="filmStrip"]::after{bottom:16px;}

  [data-layout="terrazzo"]{
    background-image:
      radial-gradient(circle at 15% 18%, color-mix(in srgb, var(--accent) 60%, transparent) 0 5px, transparent 6px),
      radial-gradient(circle at 82% 14%, color-mix(in srgb, var(--seal) 55%, transparent) 0 4px, transparent 5px),
      radial-gradient(circle at 72% 88%, color-mix(in srgb, var(--accent) 55%, transparent) 0 6px, transparent 7px),
      radial-gradient(circle at 22% 84%, color-mix(in srgb, var(--seal) 55%, transparent) 0 4px, transparent 5px),
      radial-gradient(circle at 90% 55%, color-mix(in srgb, var(--accent) 55%, transparent) 0 4px, transparent 5px);
    background-repeat:no-repeat;
  }
  [data-layout="terrazzo"] .names{font-style:normal; font-weight:700;}
  [data-layout="terrazzo"] .divider{height:4px; border-radius:2px;}

  [data-layout="starryNight"]{
    background-image:
      radial-gradient(1.6px 1.6px at 18% 14%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 74% 24%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 42% 8%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 90% 12%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 60% 20%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 10% 30%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 30% 92%, var(--accent) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 85% 88%, var(--accent) 50%, transparent 51%);
    background-repeat:no-repeat; opacity:1;
  }
  [data-layout="starryNight"] .divider{background:linear-gradient(90deg, transparent, var(--accent), transparent); width:130px; height:1px;}

  [data-layout="laceScallop"]{position:relative;}
  [data-layout="laceScallop"]::before{content:''; position:absolute; inset:9px; border:1px dashed var(--accent); opacity:.45; border-radius:3px; pointer-events:none;}
  [data-layout="laceScallop"] .names{font-size:calc(var(--namesize,42px) * .92);}
  [data-layout="laceScallop"] .divider{width:34px;}

  [data-layout="postcard"]{align-items:flex-start; text-align:left; padding-right:92px; position:relative;}
  [data-layout="postcard"] .eyebrow{max-width:78%;}
  [data-layout="postcard"]::before{content:''; position:absolute; top:92px; right:24px; width:50px; height:64px; border:2px dashed var(--accent); opacity:.6;}
  [data-layout="postcard"]::after{content:''; position:absolute; top:116px; right:84px; width:42px; height:42px; border-radius:50%; border:1.5px solid var(--accent); opacity:.3;}
  [data-layout="postcard"] .divider{margin-left:0;}

  /* --- Premium Website layout: full scrolling one-pager, not a token card --- */
  [data-layout="premium"]{
    width:100%; max-width:460px; padding:0; overflow:hidden; border-radius:14px;
    align-items:stretch; text-align:left; display:block; min-height:0;
  }
  [data-layout="premium"] .p-hero{position:relative; height:380px; overflow:hidden; background:var(--seal,#333);}
  [data-layout="premium"] .p-hero img{width:100%; height:100%; object-fit:cover; display:block;}
  [data-layout="premium"] .p-hero-fallback{width:100%; height:100%; background:linear-gradient(155deg,var(--accent),var(--seal));}
  [data-layout="premium"] .p-tear{position:absolute; left:-1%; right:-1%; bottom:-1px; width:102%; height:50px; display:block;}
  [data-layout="premium"] .p-body{padding:32px 30px 8px; text-align:center;}
  [data-layout="premium"] .p-eyebrow{font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.24em; text-transform:uppercase; opacity:.65;}
  [data-layout="premium"] .p-names{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-size:38px; margin:10px 0 16px; line-height:1.1;}
  [data-layout="premium"] .p-intro{font-family:var(--bodyfont,'EB Garamond',serif); font-size:15px; line-height:1.7; opacity:.85; margin-bottom:20px;}
  [data-layout="premium"] .p-savedate{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-size:32px; margin:4px 0 16px;}
  [data-layout="premium"] .p-daterow{display:flex; justify-content:center; align-items:baseline; gap:18px; padding:12px 0; border-top:1px solid currentColor; border-bottom:1px solid currentColor; opacity:.92; margin:0 0 20px; font-family:'Inter',sans-serif; font-size:13px; letter-spacing:.06em; text-transform:uppercase;}
  [data-layout="premium"] .p-daterow .p-daynum{font-family:var(--headfont); font-style:normal; font-size:30px; letter-spacing:0; text-transform:none;}
  [data-layout="premium"] .p-rsvpbtn{display:inline-block; background:var(--accent,#B08D57); color:#fff; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:13px 34px; border-radius:6px; text-decoration:none; margin-bottom:28px; border:none; cursor:pointer;}
  [data-layout="premium"] .p-schedule{display:flex; background:var(--accent,#B08D57);}
  [data-layout="premium"] .p-schedule.single{justify-content:center;}
  [data-layout="premium"] .p-schedule.single .p-eventcard{flex:none; width:100%;}
  [data-layout="premium"] .p-eventcard{flex:1; color:#fff; padding:20px 18px 22px; min-width:0;}
  [data-layout="premium"] .p-eventcard + .p-eventcard{border-left:1px solid rgba(255,255,255,.25);}
  [data-layout="premium"] .p-eventcard .p-evdate{font-family:'Inter',sans-serif; font-size:11px; opacity:.85; text-transform:uppercase; letter-spacing:.04em;}
  [data-layout="premium"] .p-eventcard .p-evname{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-size:25px; margin:2px 0 8px; line-height:1.1;}
  [data-layout="premium"] .p-eventcard .p-evdesc{font-family:var(--bodyfont,'EB Garamond',serif); font-size:12.5px; line-height:1.5; opacity:.92; margin-bottom:8px;}
  [data-layout="premium"] .p-eventcard .p-evattire{font-family:'Inter',sans-serif; font-size:11px; font-weight:700; margin-bottom:10px;}
  [data-layout="premium"] .p-eventcard .p-evlink{font-family:'Inter',sans-serif; font-size:11px; text-decoration:underline; color:#fff; opacity:.9;}
  [data-layout="premium"] .p-photocta{position:relative; margin-top:0; height:320px; overflow:hidden; background:var(--seal,#333);}
  [data-layout="premium"] .p-photocta img{width:100%; height:100%; object-fit:cover; display:block;}
  [data-layout="premium"] .p-photocta-fallback{width:100%; height:100%; background:linear-gradient(155deg,var(--seal),var(--accent));}
  [data-layout="premium"] .p-photocta-overlay{position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.05) 65%); display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:24px 22px; text-align:center;}
  [data-layout="premium"] .p-photocta-overlay .p-script{color:#fff; font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-size:23px;}
  [data-layout="premium"] .p-photocta-overlay p{color:rgba(255,255,255,.85); font-family:var(--bodyfont,'EB Garamond',serif); font-size:12.5px; margin:8px 0 16px; line-height:1.5;}
  [data-layout="premium"] .p-sharebtn{background:#fff; color:#222; font-family:'Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:11px 20px; border-radius:5px; text-decoration:none;}
  [data-layout="premium"] .p-rsvpsection{padding:34px 28px 38px; text-align:center;}
  [data-layout="premium"] .p-rsvptitle{font-size:29px; margin:0 0 6px;}
  [data-layout="premium"] .p-rsvptitle .p-script2{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic;}
  [data-layout="premium"] .p-rsvptitle .p-bold2{font-family:'Inter',sans-serif; font-weight:800; margin-left:6px;}
  [data-layout="premium"] .p-rsvpnote{font-family:var(--bodyfont,'EB Garamond',serif); font-size:13.5px; opacity:.85; margin:6px 0 14px;}
  [data-layout="premium"] .p-strict{font-family:'Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:18px;}
  [data-layout="premium"] .p-countdown{display:flex; justify-content:center; gap:14px; margin-top:24px;}
  [data-layout="premium"] .p-countdown .p-cbox{text-align:center; min-width:38px;}
  [data-layout="premium"] .p-countdown .p-cnum{font-family:var(--headfont,'Cormorant Garamond',serif); font-size:27px; display:block;}
  [data-layout="premium"] .p-countdown .p-clabel{font-family:'Inter',sans-serif; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; display:block;}
  [data-layout="premium"] .p-entrypass{margin-top:28px; border:1px solid currentColor; border-radius:10px; padding:16px; display:flex; align-items:center; gap:16px; opacity:.95;}
  [data-layout="premium"] .p-entrypass-label{font-family:'Inter',sans-serif; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; opacity:.6; margin-bottom:4px;}
  [data-layout="premium"] .p-entrypass .seal{margin:0; flex:none;}
  [data-layout="premium"] .p-entrypass-name{font-family:var(--headfont,'Cormorant Garamond',serif); font-style:italic; font-size:19px;}
  [data-layout="premium"] .p-entrypass-tag{font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; opacity:.7; margin-top:2px;}
  [data-layout="premium"] .eventcolors{padding:0 24px 22px; margin-top:0;}
</style>
</head>
<body>
  <div class="invite-card" id="card"></div>
  <div class="fallback" id="fallback">This invite link is missing its details — ask the couple to resend it to you.</div>

<script>
const params = new URLSearchParams(window.location.search);
const get = (k, d='') => params.get(k) || d;

// The couple's card design, baked in so every guest link only needs to carry
// that guest's own id/name/seats instead of repeating the whole design every time.
// Kept in sync with index.html's INVITE_DEFAULTS — index.html only adds a URL
// param when a guest's link actually differs from these (e.g. after the couple
// customizes something), so this is the "nothing customized" baseline, not a cap.
const INVITE_DEFAULTS = {
  p1:'Amara', p2:'Julian', wdate:'2027-02-14', wtime:'16:30',
  venue:'The Old Botanical Hall', city:'Dar es Salaam', eyebrow:'Together with their families',
  cBg:'#f2f3ec', cInk:'#2f331f', cAccent:'#8d9e47', cSeal:'#616f2a',
  layout:'premium', hf:0, bf:0, sc:1,
  // The couple's photo is baked in here rather than ever traveling in a guest link —
  // as a compressed data URL it can be tens of KB, which would make every link huge.
  // index.html never adds a `photo` URL param; update this value (and redeploy) when
  // the couple sets/changes their photo.
  photo:'', showEventColors:true, ec1:'#46583d', ec2:'#b08d57', ec3:'#6c7f60', ec4:'#c88b87',
  introText:'With joyful hearts and the blessings of our families, we invite you to share the celebration of our love as we begin their life together.',
  ev1Attire:'', ev2Name:'', ev2Date:'', ev2Time:'', ev2Venue:'', ev2Desc:'', ev2Attire:'', shareUrl:'', rsvpUrl:'',
};

const d = {
  p1: get('p1', INVITE_DEFAULTS.p1), p2: get('p2', INVITE_DEFAULTS.p2),
  wdate: get('wdate', INVITE_DEFAULTS.wdate), wtime: get('wtime', INVITE_DEFAULTS.wtime),
  venue: get('venue', INVITE_DEFAULTS.venue), city: get('city', INVITE_DEFAULTS.city),
  eyebrow: get('eyebrow', INVITE_DEFAULTS.eyebrow),
  cBg: get('cBg', INVITE_DEFAULTS.cBg), cInk: get('cInk', INVITE_DEFAULTS.cInk),
  cAccent: get('cAccent', INVITE_DEFAULTS.cAccent), cSeal: get('cSeal', INVITE_DEFAULTS.cSeal),
  layout: get('layout', INVITE_DEFAULTS.layout),
  hf: parseInt(get('hf', INVITE_DEFAULTS.hf), 10) || 0,
  bf: parseInt(get('bf', INVITE_DEFAULTS.bf), 10) || 0,
  sc: parseInt(get('sc', INVITE_DEFAULTS.sc), 10) || 0,
  photo: get('photo', INVITE_DEFAULTS.photo),
  showEventColors: get('showEventColors', INVITE_DEFAULTS.showEventColors ? '1' : '0') === '1',
  eventColors: [
    get('ec1', INVITE_DEFAULTS.ec1), get('ec2', INVITE_DEFAULTS.ec2),
    get('ec3', INVITE_DEFAULTS.ec3), get('ec4', INVITE_DEFAULTS.ec4),
  ],
  introText: get('introText', INVITE_DEFAULTS.introText), ev1Attire: get('ev1Attire', INVITE_DEFAULTS.ev1Attire),
  ev2Name: get('ev2Name', INVITE_DEFAULTS.ev2Name), ev2Date: get('ev2Date', INVITE_DEFAULTS.ev2Date),
  ev2Time: get('ev2Time', INVITE_DEFAULTS.ev2Time), ev2Venue: get('ev2Venue', INVITE_DEFAULTS.ev2Venue),
  ev2Desc: get('ev2Desc', INVITE_DEFAULTS.ev2Desc), ev2Attire: get('ev2Attire', INVITE_DEFAULTS.ev2Attire),
  shareUrl: get('shareUrl', INVITE_DEFAULTS.shareUrl), rsvpUrl: get('rsvpUrl', INVITE_DEFAULTS.rsvpUrl),
};
const guestId = get('id');
const guestName = get('name');
const seats = parseInt(get('seats','1')) || 1;

// Same layout/type token system as index.html's Template picker.
const HEADING_FONTS = [
  {name:'Cormorant Garamond', css:"'Cormorant Garamond',serif", gf:'Cormorant+Garamond:ital,wght@0,500;0,600;1,500', italic:true},
  {name:'Playfair Display',   css:"'Playfair Display',serif",   gf:'Playfair+Display:ital,wght@0,500;0,700;1,500',   italic:true},
  {name:'Marcellus',          css:"'Marcellus',serif",          gf:'Marcellus',                                     italic:false},
  {name:'Italiana',           css:"'Italiana',serif",           gf:'Italiana',                                      italic:false},
  {name:'Cormorant',          css:"'Cormorant',serif",          gf:'Cormorant:ital,wght@0,500;0,600;1,500',         italic:true},
];
const BODY_FONTS = [
  {name:'EB Garamond',  css:"'EB Garamond',serif",     gf:'EB+Garamond:ital,wght@0,400;0,500;1,400'},
  {name:'Lora',         css:"'Lora',serif",            gf:'Lora:ital,wght@0,400;0,500;1,400'},
  {name:'Jost',         css:"'Jost',sans-serif",       gf:'Jost:wght@400;500'},
  {name:'Inter',        css:"'Inter',sans-serif",      gf:'Inter:wght@400;500'},
  {name:'Crimson Text', css:"'Crimson Text',serif",    gf:'Crimson+Text:ital,wght@0,400;0,600;1,400'},
];
const SCALES = [
  {name:'Intimate', nameSize:'34px', detailSize:'15.5px'},
  {name:'Grand',    nameSize:'46px', detailSize:'18px'},
];
const VALID_LAYOUTS = ['classic','banner','framed','arch','split','monogram','minimalLine','editorial','botanical','timeline','watercolor','artdeco','kraftRustic','filmStrip','terrazzo','starryNight','laceScallop','postcard','premium'];

const loadedFonts = new Set();
function ensureFont(gf){
  if(loadedFonts.has(gf)) return;
  loadedFonts.add(gf);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?family=' + gf + '&display=swap';
  document.head.appendChild(link);
}

function fmtDate(iso){
  if(!iso) return '';
  const dt = new Date(iso+'T00:00:00');
  return dt.toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function partyTag(seats){
  if(seats<=1) return 'SINGLE';
  if(seats===2) return 'DOUBLE';
  return 'PARTY OF ' + seats;
}
function eventColorsHTML(design){
  if(!design.showEventColors || !design.eventColors) return '';
  const cols = design.eventColors.filter(Boolean);
  if(!cols.length) return '';
  const dots = cols.map(c=>`<span class="ecolor" style="background:${c}"></span>`).join('');
  return `<div class="eventcolors"><div class="eclabel">Event Colors</div><div class="ecolors-row">${dots}</div></div>`;
}

// ---------- PREMIUM WEBSITE LAYOUT (full one-pager, not a token card) ----------
function fmtMonthDayYear(iso){
  if(!iso) return {month:'', day:'', year:''};
  const dt = new Date(iso+'T00:00:00');
  return { month: dt.toLocaleDateString(undefined,{month:'long'}).toUpperCase(), day: dt.getDate(), year: dt.getFullYear() };
}
function mapsLink(venue, city){
  const q = [venue, city].filter(Boolean).join(', ');
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
}
function tearEdgeSVG(color){
  return `<svg class="p-tear" viewBox="0 0 100 10" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,10 L0,5 L5,7 L11,3 L17,6 L23,2 L30,7 L37,3 L44,6.5 L51,2.5 L58,6 L65,2 L72,6.5 L79,3 L86,7 L93,2.5 L100,6 L100,10 Z" fill="${color}"></path></svg>`;
}
function buildEventCard(label, iso, time, venue, city, desc, attire){
  const {month, day} = fmtMonthDayYear(iso);
  const link = mapsLink(venue, city);
  const place = [venue, city].filter(Boolean).join(', ');
  return `
    <div class="p-eventcard">
      <div class="p-evdate">${month ? month.slice(0,3) : ''} ${day || ''}${time ? ' &middot; ' + fmtTime(time) : ''}</div>
      <div class="p-evname">${label}</div>
      ${desc ? `<div class="p-evdesc">${desc}</div>` : ''}
      ${attire ? `<div class="p-evattire">Attire: ${attire}</div>` : ''}
      ${place ? `<div class="p-evdesc" style="opacity:.85; margin-bottom:4px;">${place}</div>` : ''}
      ${link ? `<a class="p-evlink" href="${link}" target="_blank" rel="noopener">Get Directions</a>` : ''}
    </div>`;
}
function buildPremiumSite(d, guestName, seats){
  const heroInner = d.photo ? `<img src="${d.photo}" alt="">` : `<div class="p-hero-fallback"></div>`;
  const heroBlock = `<div class="p-hero">${heroInner}${tearEdgeSVG(d.cBg)}</div>`;
  const { month, day } = fmtMonthDayYear(d.wdate);
  const hasSecond = !!(d.ev2Name && d.ev2Name.trim());
  const scheduleHTML = hasSecond ? `
    <div class="p-schedule">
      ${buildEventCard(d.ev2Name, d.ev2Date, d.ev2Time, d.ev2Venue, '', d.ev2Desc, d.ev2Attire)}
      ${buildEventCard('Wedding', d.wdate, d.wtime, d.venue, d.city, '', d.ev1Attire)}
    </div>` : `
    <div class="p-schedule single">
      ${buildEventCard('Wedding', d.wdate, d.wtime, d.venue, d.city, '', d.ev1Attire)}
    </div>`;
  const photoCtaHTML = d.photo ? `
    <div class="p-photocta">
      <img src="${d.photo}" alt="">
      <div class="p-photocta-overlay">
        <div class="p-script">Share your photos with us</div>
        <p>${d.introText || ''}</p>
        ${d.shareUrl ? `<a class="p-sharebtn" href="${d.shareUrl}" target="_blank" rel="noopener">Share your memories here</a>` : ''}
      </div>
    </div>` : '';
  const rsvpBtn = d.rsvpUrl
    ? `<a class="p-rsvpbtn" href="${d.rsvpUrl}" target="_blank" rel="noopener">RSVP</a>`
    : `<span class="p-rsvpbtn" style="opacity:.55; cursor:default;">RSVP</span>`;
  const entryPass = `
    <div class="p-entrypass">
      <div class="seal" id="sealBox"></div>
      <div>
        <div class="p-entrypass-label">Your entry pass</div>
        <div class="p-entrypass-name">${guestName}</div>
        <div class="p-entrypass-tag">${partyTag(seats)}</div>
      </div>
    </div>`;

  return `
    ${heroBlock}
    <div class="p-body">
      <div class="p-eyebrow">${d.eyebrow || ''}</div>
      <div class="p-names">${d.p1} &amp; ${d.p2}</div>
      <div class="p-intro">${d.introText || ''}</div>
      <div class="p-savedate">Save the date</div>
      <div class="p-daterow"><span>${month}</span><span class="p-daynum">${day}</span><span>${fmtTime(d.wtime)}</span></div>
      ${rsvpBtn}
    </div>
    ${scheduleHTML}
    ${photoCtaHTML}
    <div class="p-rsvpsection">
      <div class="p-rsvptitle"><span class="p-script2">Please</span><span class="p-bold2">RSVP</span></div>
      <div class="p-rsvpnote">The favour of your response is requested as soon as you can.</div>
      <div class="p-strict">Strictly by invite only</div>
      ${rsvpBtn}
      ${eventColorsHTML(d)}
      <div class="p-countdown">
        <div class="p-cbox"><span class="p-cnum p-c-months">0</span><span class="p-clabel">Months</span></div>
        <div class="p-cbox"><span class="p-cnum p-c-days">0</span><span class="p-clabel">Days</span></div>
        <div class="p-cbox"><span class="p-cnum p-c-hours">0</span><span class="p-clabel">Hours</span></div>
        <div class="p-cbox"><span class="p-cnum p-c-mins">0</span><span class="p-clabel">Min</span></div>
        <div class="p-cbox"><span class="p-cnum p-c-secs">0</span><span class="p-clabel">Sec</span></div>
      </div>
      ${entryPass}
      <div style="margin-top:22px;">
        <a class="p-rsvpbtn" href="guestbook.html" style="text-decoration:none;">Leave a message for us</a>
      </div>
    </div>
  `;
}
function startCountdown(container, wdate, wtime){
  const el = container.querySelector('.p-countdown');
  if(!el || !wdate) return null;
  const target = new Date(wdate + 'T' + (wtime || '00:00') + ':00');
  function tick(){
    const diff = Math.max(0, target - new Date());
    const totalSec = Math.floor(diff/1000);
    const days = Math.floor(totalSec/86400);
    const months = Math.floor(days/30);
    const remDays = days % 30;
    const hours = Math.floor((totalSec%86400)/3600);
    const mins = Math.floor((totalSec%3600)/60);
    const secs = totalSec%60;
    const set = (cls,val)=>{ const e = el.querySelector('.'+cls); if(e) e.textContent = String(val); };
    set('p-c-months', months); set('p-c-days', remDays); set('p-c-hours', hours); set('p-c-mins', mins); set('p-c-secs', secs);
  }
  tick();
  return setInterval(tick, 1000);
}

if(!guestId || !guestName){
  document.getElementById('card').style.display='none';
  document.getElementById('fallback').style.display='block';
} else {
  const card = document.getElementById('card');
  const layout = VALID_LAYOUTS.includes(d.layout) ? d.layout : 'classic';
  const hf = HEADING_FONTS[d.hf] || HEADING_FONTS[0];
  const bf = BODY_FONTS[d.bf] || BODY_FONTS[0];
  const sc = SCALES[d.sc] || SCALES[1];
  const mono = ((d.p1||'')[0]||'').toUpperCase() + ((d.p2||'')[0]||'').toUpperCase();

  card.dataset.layout = layout;
  card.style.background = d.cBg;
  card.style.color = d.cInk;
  card.style.setProperty('--bg', d.cBg);
  card.style.setProperty('--accent', d.cAccent);
  card.style.setProperty('--seal', d.cSeal);
  card.style.setProperty('--headfont', hf.css);
  card.style.setProperty('--bodyfont', bf.css);
  card.style.setProperty('--namesize', sc.nameSize);
  card.style.setProperty('--detailsize', sc.detailSize);
  card.classList.toggle('no-italic', !hf.italic);
  ensureFont(hf.gf);
  ensureFont(bf.gf);

  const photoBlock = d.photo ? `<div class="photoblock"><img src="${d.photo}" alt=""></div>` : '';

  card.innerHTML = layout === 'premium' ? buildPremiumSite(d, guestName, seats) : `
    ${photoBlock}
    <div class="mono-mark">${mono}</div>
    <div class="eyebrow">${d.eyebrow}</div>
    <div class="names">${d.p1}<span class="amp">&amp;</span>${d.p2}</div>
    <div class="divider"></div>
    <div class="details">
      <div class="dline">${fmtDate(d.wdate)}</div>
      <div class="dline">${fmtTime(d.wtime)}</div>
      <div class="dline">${[d.venue,d.city].filter(Boolean).join(', ')}</div>
    </div>
    <div class="guestblock">
      <div class="guestline">Reserved for</div>
      <div class="guestname">${guestName}${seats>1?` &amp; party of ${seats}`:''}</div>
    </div>
    ${eventColorsHTML(d)}
    <div class="sealblock">
      <div class="sealrow">
        <div class="seal" id="sealBox"></div>
        <div class="ptag">${partyTag(seats)}</div>
      </div>
      <div class="seal-cap">present this code at entry</div>
    </div>
    <button class="addwallet" onclick="window.print()">Save / print this invite</button>
    <a class="addwallet" href="guestbook.html" style="text-decoration:none; margin-left:10px;">Leave us a message</a>
  `;

  if(layout === 'premium'){ startCountdown(card, d.wdate, d.wtime); }

  // Payload the door-scanner will decode. Self-contained, no server lookup needed.
  // Compact pipe-delimited format (not JSON) keeps the QR small enough to scan reliably
  // off a phone screen — every extra character here adds modules, and more modules
  // packed into the same physical size means fewer pixels per module for a camera to resolve.
  const payload = ['WED1', guestId, guestName, String(seats)].join('|');

  // A denser QR (more characters -> more modules) needs proportionally more physical
  // pixels to stay scannable; the split layout's QR sits in a narrower column so it
  // gets a smaller-but-still-solid size. Keep the QRCode pixel size and the CSS display
  // size identical so the canvas is never upscaled (which would blur it and break scans).
  const qrSize = layout === 'split' ? 150 : (layout === 'premium' ? 130 : 200);
  card.style.setProperty('--qrsize', qrSize + 'px');

  try{
    if(typeof QRCode === 'undefined') throw new Error('QRCode library did not load');
    new QRCode(document.getElementById('sealBox'), {
      text: payload,
      width: qrSize, height: qrSize,
      colorDark: d.cInk, colorLight: d.cBg,
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(err){
    document.getElementById('sealBox').innerHTML =
      `<div style="font-size:9px; padding:6px; word-break:break-all; font-family:monospace; line-height:1.3;">${guestId}</div>`;
    document.getElementById('sealBox').title = 'QR code failed to generate — reload this page. Door staff can paste this ID manually.';
  }
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
